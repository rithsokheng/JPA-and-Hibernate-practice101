spring.application.name=spring-data-jpa

# Configure datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=m2_db
spring.datasource.username=postgres
spring.datasource.password=999
spring.datasource.driver-class-name=org.postgresql.Driver

# Configure JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=m2_db
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
